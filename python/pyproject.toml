[project]
name = "meshcore-localapi"
version = "0.1.0"
description = "Client for the MeshCore Local API: share a MeshCore host app's radio over a loopback WebSocket"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcore_localapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
